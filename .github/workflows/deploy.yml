name: Frontend CI-CD Pipeline

on:
  push:
    branches: [main, develop, quang-duc]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: foodsaver-frontend
  REPO_URL: https://github.com/Ducdz2k4/FoodSaver-FE.git
  DEPLOY_DIR: /opt/foodsaver-fe

jobs:
  lint-and-check:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint || true

      - name: Run Typecheck
        run: npm run typecheck || true

  build:
    name: Build Next.js Application
    runs-on: ubuntu-24.04
    needs: lint-and-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.foodsaver.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & PM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.foodsaver.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo '🚀 Starting deployment for FoodSaver Frontend...'

            # Clone or update repository
            if [ ! -d '${{ env.DEPLOY_DIR }}' ]; then
              sudo mkdir -p '${{ env.DEPLOY_DIR }}'
              sudo chown -R \$USER:\$USER '${{ env.DEPLOY_DIR }}'
              git clone '${{ env.REPO_URL }}' '${{ env.DEPLOY_DIR }}'
            fi

            cd '${{ env.DEPLOY_DIR }}'
            git remote set-url origin '${{ env.REPO_URL }}' || true
            git fetch origin main
            git reset --hard origin/main

            # Write production .env.local for Next.js build
            {
              echo \"NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL\"
              echo \"NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID\"
            } > .env.local

            # Install dependencies
            npm install

            # Build Next.js
            echo '⚡ Building Next.js application...'
            NODE_OPTIONS=\"--max-old-space-size=2048\" npm run build

            # Zero-downtime reload via PM2
            echo '🔄 Reloading PM2 service...'
            pm2 reload foodsaver-fe || pm2 restart foodsaver-fe || pm2 start npm --name \"foodsaver-fe\" -- start -p 4000
            pm2 save

            echo '⏳ Checking service status...'
            sleep 3
            pm2 status foodsaver-fe

            echo '✅ Frontend deployment completed successfully!'
          "
