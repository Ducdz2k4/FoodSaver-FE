name: Frontend CI-CD Pipeline

on:
  push:
    branches: [main, develop, quang-duc]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: foodsaver-frontend
  REPO_URL: https://github.com/Ducdz2k4/FoodSaver-FE.git
  DEPLOY_DIR: /opt/foodsaver-fe

jobs:
  lint-and-check:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint || true

      - name: Run Typecheck
        run: npm run typecheck || true

  build:
    name: Build Next.js Application
    runs-on: ubuntu-24.04
    needs: lint-and-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.foodsaver.voxelle.io.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

  deploy:
    name: Blue-Green Deploy to VPS
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Blue-Green Deploy via SSH & PM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.foodsaver.voxelle.io.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "📡 Testing network connectivity to $SERVER_HOST:$SERVER_PORT..."
          nc -z -v -w 5 "$SERVER_HOST" "$SERVER_PORT" 2>&1 || true

          echo "🚀 Initiating Blue-Green Zero-Downtime Deployment via SSH..."
          ssh -i ~/.ssh/id_rsa \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SERVER_USER@$SERVER_HOST" \
            "env NEXT_PUBLIC_API_BASE_URL='$NEXT_PUBLIC_API_BASE_URL' NEXT_PUBLIC_GOOGLE_CLIENT_ID='$NEXT_PUBLIC_GOOGLE_CLIENT_ID' NEXT_PUBLIC_MAPBOX_TOKEN='$NEXT_PUBLIC_MAPBOX_TOKEN' REPO_URL='${{ env.REPO_URL }}' COMMIT_SHA='${{ github.sha }}' bash -s" << 'REMOTE_DEPLOY_EOF'
          set -e

          APP_DIR="/opt/foodsaver-fe"
          RELEASES_DIR="$APP_DIR/releases"
          SHARED_DIR="$APP_DIR/shared"
          CURRENT_LINK="$APP_DIR/current"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          NEW_RELEASE_DIR="$RELEASES_DIR/$TIMESTAMP"

          echo "=========================================================="
          echo "🚀 [BLUE-GREEN DEPLOY] FoodSaver Frontend"
          echo "Target Release : $TIMESTAMP"
          echo "Git Commit     : ${COMMIT_SHA:-HEAD}"
          echo "=========================================================="

          # 1. Setup base directory structure
          mkdir -p "$RELEASES_DIR" "$SHARED_DIR"

          # 2. Identify currently active release (Blue slot) for instant rollback
          PREV_RELEASE=""
          if [ -L "$CURRENT_LINK" ]; then
            PREV_RELEASE=$(readlink -f "$CURRENT_LINK" || true)
            echo "🔵 Currently active Blue release: $PREV_RELEASE"
          elif [ -d "$CURRENT_LINK" ]; then
            echo "⚠️ Migrating legacy directory to Blue-Green release structure..."
            LEGACY_BACKUP="$RELEASES_DIR/legacy_$TIMESTAMP"
            mv "$CURRENT_LINK" "$LEGACY_BACKUP"
            ln -sfn "$LEGACY_BACKUP" "$CURRENT_LINK"
            PREV_RELEASE="$LEGACY_BACKUP"
            echo "🔵 Migrated Blue release: $PREV_RELEASE"
          else
            echo "ℹ️ No existing release found. Initial fresh deployment."
          fi

          # 3. Automatic Rollback Trap: Triggers if ANY failure occurs
          rollback_on_error() {
            local exit_code=$?
            if [ $exit_code -ne 0 ]; then
              echo "=========================================================="
              echo "❌ [DEPLOYMENT ERROR] Step failed with exit code $exit_code"
              echo "🛡️ TRIGGERING AUTOMATIC BLUE-GREEN ROLLBACK / FALLBACK..."
              echo "=========================================================="

              # Remove broken Green slot
              if [ -d "$NEW_RELEASE_DIR" ]; then
                echo "🧹 Removing failed Green directory: $NEW_RELEASE_DIR"
                rm -rf "$NEW_RELEASE_DIR"
              fi

              # Ensure symlink points to previous healthy release
              if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
                echo "🔄 Restoring live traffic symlink to Blue release: $PREV_RELEASE"
                ln -sfn "$PREV_RELEASE" "$APP_DIR/current_tmp"
                mv -Tf "$APP_DIR/current_tmp" "$CURRENT_LINK"

                echo "🔄 Ensuring PM2 service is serving Blue release..."
                cd "$CURRENT_LINK"
                pm2 reload foodsaver-fe || pm2 restart foodsaver-fe || pm2 start npm --name "foodsaver-fe" -- start || true
                echo "✅ Fallback complete: Production remains 100% ONLINE on previous version ($PREV_RELEASE)!"
              else
                echo "⚠️ No previous release available to roll back to."
              fi
              echo "=========================================================="
              exit $exit_code
            fi
          }
          trap 'rollback_on_error' ERR

          # Step 1: Clone source into isolated Green slot
          echo "🟢 [1/6] Staging Green release in isolated directory: $NEW_RELEASE_DIR..."
          git clone --depth 1 "$REPO_URL" "$NEW_RELEASE_DIR"
          cd "$NEW_RELEASE_DIR"
          if [ -n "$COMMIT_SHA" ]; then
            git fetch --depth 1 origin "$COMMIT_SHA" 2>/dev/null || true
            git checkout "$COMMIT_SHA" 2>/dev/null || true
          fi

          # Step 2: Configure environment variables in shared storage & link
          echo "⚙️ [2/6] Writing production environment variables..."
          {
            echo "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL"
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
            echo "NEXT_PUBLIC_MAPBOX_TOKEN=$NEXT_PUBLIC_MAPBOX_TOKEN"
          } > "$SHARED_DIR/.env.local"
          ln -sfn "$SHARED_DIR/.env.local" "$NEW_RELEASE_DIR/.env.local"

          # Step 3: Install dependencies in Green slot
          echo "📦 [3/6] Installing dependencies in Green slot..."
          npm ci --prefer-offline --no-audit || npm install --no-audit

          # Step 4: Build Next.js application in Green slot
          echo "⚡ [4/6] Building Next.js application in Green slot..."
          NODE_OPTIONS="--max-old-space-size=2048" npm run build

          # Verify build output exists before cutover
          if [ ! -d "$NEW_RELEASE_DIR/.next" ]; then
            echo "❌ Build artifact .next missing in Green release!"
            exit 1
          fi
          echo "✅ Green release compiled and validated successfully!"

          # Step 5: Atomic Cutover (Symlink Switch)
          echo "🔀 [5/6] Performing atomic cutover to Green release..."
          ln -sfn "$NEW_RELEASE_DIR" "$APP_DIR/current_tmp"
          mv -Tf "$APP_DIR/current_tmp" "$CURRENT_LINK"

          # Step 6: Zero-Downtime Reload & Health Check
          echo "🔄 [6/6] Reloading PM2 frontend service (Zero-Downtime)..."
          cd "$CURRENT_LINK"
          if pm2 describe foodsaver-fe > /dev/null 2>&1; then
            pm2 reload foodsaver-fe --update-env
          else
            pm2 start npm --name "foodsaver-fe" -- start
          fi
          pm2 save

          echo "⏳ Verifying application health status..."
          sleep 4
          HEALTHY=false
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")
            echo "Health check attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              HEALTHY=true
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Application failed health check after switchover!"
            exit 1
          fi

          # Clean up older releases (retain current + 3 previous)
          echo "🧹 Housekeeping: Retaining 4 most recent releases..."
          cd "$RELEASES_DIR"
          ls -dt */ 2>/dev/null | tail -n +5 | xargs rm -rf 2>/dev/null || true

          echo "=========================================================="
          echo "🎉 [SUCCESS] Blue-Green deployment completed with Zero Downtime!"
          echo "Active Version: $TIMESTAMP"
          echo "=========================================================="
          REMOTE_DEPLOY_EOF
